[package]
name = "pkfinder"
version = "0.14.0"
edition = "2021"
authors = ["Andrew Ritter"]
description = "Assists with finding the best primary key combination for a given dataset"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

#[profile.release]
#debug = true
#opt-level = 3
#codegen-units = 1

[dependencies]
itertools = "0.10.3"
# structopt = "0.3.26"
clap = { version = "3.0", features = ["derive"] }
csv = "1.1.6"
rayon = "1.5.1"
pyo3 = { version = "0.17.1", features = ["extension-module"] }
regex-lite = "0.1.0"

[lib]
crate-type = ["cdylib"]
